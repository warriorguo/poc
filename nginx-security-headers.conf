# Included into every location that sets an add_header of its own.
#
# nginx's add_header directives are NOT inherited into a block that declares
# any add_header itself, so setting Cache-Control inside a location silently
# drops the server-level security headers. Including this file at each such
# location is the fix; adding them once at server level is not enough.

# The app is entirely self-hosted: no external scripts, fonts, or beacons.
# connect-src 'self' covers the API calls; style-src allows 'unsafe-inline'
# because the calendar sets per-project colours through inline custom properties.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), interest-cohort=()" always;
