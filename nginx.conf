server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 1m;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    include /etc/nginx/security-headers.conf;

    location /api/ {
        include /etc/nginx/security-headers.conf;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location / {
        include /etc/nginx/security-headers.conf;

        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Vite emits content-hashed filenames, so these are safe to pin.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        include /etc/nginx/security-headers.conf;

        # max-age lives in the add_header rather than an `expires` directive:
        # using both emits two Cache-Control headers.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Liveness: the container is up. Readiness lives at /api/healthz, which
    # also checks the database.
    location = /healthz {
        include /etc/nginx/security-headers.conf;

        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
